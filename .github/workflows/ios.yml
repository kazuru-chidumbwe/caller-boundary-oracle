name: ios

# NFCPassportReader (iOS only): the test runs in the iOS Simulator and reaches the harness chip
# through tools/chip_broker.py on the macOS host.
on:
  workflow_dispatch:
  push:
    paths:
      - "drivers/ios/**"
      - "tools/chip_broker.py"
      - "tools/ios_*.py"
      - "tools/vsmartcard/**"
      - "suites/ios.json"
      - "profiles/**"
      - "scripts/bootstrap-vsmartcard.sh"
      - "cmd/chip-serve/**"
      - "simulator/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  nfcpassportreader:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: harness

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Pinned gmrtd (for chip-serve) and NFCPassportReader
        working-directory: harness
        run: |
          bash scripts/bootstrap-vendor.sh
          bash scripts/bootstrap-ios.sh
          go build -o bin/chip-serve ./cmd/chip-serve

      - name: Independent chip (OpenPACE + vsmartcard)
        working-directory: harness
        run: |
          brew install autoconf automake libtool pkg-config openssl@3 swig gengetopt help2man
          # OpenPACE builds its Python bindings with setuptools, which Homebrew's Python lacks.
          python3 -m pip install -q --break-system-packages setuptools==80.9.0
          # configure picks its own Python unless told; use the one that has setuptools and runs the card.
          PYTHON="$(command -v python3)" PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig" \
            bash scripts/bootstrap-vsmartcard.sh

      - name: Start chip broker
        working-directory: harness
        run: |
          mkdir -p "$RUNNER_TEMP/chip"
          source ../_vendor/vsmartcard.env
          nohup python3 tools/chip_broker.py --out "$RUNNER_TEMP/chip" > "$RUNNER_TEMP/broker.log" 2>&1 &
          sleep 2
          cat "$RUNNER_TEMP/broker.log"

      - name: Run plan in the iOS Simulator
        working-directory: harness
        run: |
          python3 tools/ios_plan.py --manifest suites/ios.json --out "$RUNNER_TEMP/plan.json"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $UDID"
          cd drivers/ios
          xcodebuild -list
          set -o pipefail
          TEST_RUNNER_CBO_PLAN="$RUNNER_TEMP/plan.json" TEST_RUNNER_CBO_BROKER_PORT=35963 \
            xcodebuild test -scheme NFCPassportReaderOracle-Package -destination "id=$UDID" 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Collect run artifacts
        if: always()
        working-directory: harness
        run: |
          python3 tools/ios_collect.py --plan "$RUNNER_TEMP/plan.json" --test-log "$RUNNER_TEMP/test.log" \
            --chip-reports "$RUNNER_TEMP/chip" --log-dir "$RUNNER_TEMP/ios-runs"
          tail -20 "$RUNNER_TEMP/broker.log"

      - name: Verify against suites/ios.json
        working-directory: harness
        run: |
          make venv
          .venv/bin/python3 classifier/aggregate.py --log-dir "$RUNNER_TEMP/ios-runs" --manifest suites/ios.json \
            --suite-id ios --suite-seed 1
          .venv/bin/python3 classifier/verify_manifest.py "$RUNNER_TEMP/ios-runs" --manifest suites/ios.json --no-pipeline

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-runs
          path: |
            ${{ runner.temp }}/ios-runs/
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/plan.json
          retention-days: 30
